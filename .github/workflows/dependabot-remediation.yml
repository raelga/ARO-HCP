name: Dependabot Remediation Dispatcher

# Groups open Dependabot alerts by package and opens (or updates) one tracking
# issue per group assigned to the Copilot coding agent, which then produces a
# grouped, go.work-aware remediation PR following
# .github/instructions/dependabot-remediation.instructions.md.
#
# The human review/merge gate (branch protection `tide` + maintainer /lgtm) is
# always preserved — this workflow never merges anything.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the weekly Dependabot refresh
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional filter: severity (high|medium|low), ecosystem (go|pip|npm), package name, or CVE id. Empty = all."
        required: false
        default: ""
      dry_run:
        description: "List the proposed groups without creating issues."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependabot-remediation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      security-events: read # read Dependabot alerts
      issues: write # create/label tracking issues
      contents: read
    # Exposed at job level because the `secrets` context is NOT allowed in a
    # step-level `if:` — the `env` context is, so we gate the App-token step on
    # env.DEPENDABOT_APP_ID instead.
    env:
      DEPENDABOT_APP_ID: ${{ secrets.DEPENDABOT_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Preferred auth: a GitHub App installation token. The Azure/ARO-HCP org
      # BLOCKS fine-grained PATs, so upstream this is the ONLY viable non-human
      # token that can read Dependabot alerts. Use the Azure-owned App
      # "aro-hcp-robot" (App ID 2853172). It must be granted these repository
      # permissions (owner/org-admin action — it currently only has contents:write,
      # pull_requests:write, metadata:read): "Dependabot alerts: read" and
      # "Issues: write". Set secrets DEPENDABOT_APP_ID (= 2853172) +
      # DEPENDABOT_APP_PRIVATE_KEY, and install the App on the target repo. On a
      # personal fork where PATs are allowed you may skip the App and set
      # DEPENDABOT_REMEDIATION_TOKEN instead (used as a fallback below).
      - name: Mint GitHub App token
        id: app-token
        if: ${{ env.DEPENDABOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}

      - name: Group open alerts and dispatch to Copilot
        env:
          # A token that can READ Dependabot alerts is REQUIRED: the built-in
          # GITHUB_TOKEN is an "integration" and the Dependabot alerts REST API
          # rejects it with 403 "Resource not accessible by integration" even with
          # `security-events: read` granted (confirmed on this repo 2026-07-20).
          # Order of preference:
          #   1. GitHub App installation token (upstream: PATs are org-blocked).
          #   2. DEPENDABOT_REMEDIATION_TOKEN (fine-grained PAT — fork/personal only).
          #   3. github.token — only keeps non-alert gh calls working; a run with
          #      no App/PAT stops at the preflight below with a clear message.
          # The Copilot-assignment step degrades to an unassigned issue if the
          # token cannot assign the agent.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DEPENDABOT_REMEDIATION_TOKEN || github.token }}
          FILTER: ${{ inputs.filter }}
          # Safe by default: scheduled runs always do a harmless grouping preview.
          # Only a manual dispatch with dry_run=false actually opens issues.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "::group::Preflight — verify Dependabot alert read access"
          if ! gh api "repos/$REPO/dependabot/alerts?per_page=1" >/dev/null 2>&1; then
            echo "::error::Cannot read Dependabot alerts for $REPO."
            echo "::error::Configure a GitHub App (DEPENDABOT_APP_ID + DEPENDABOT_APP_PRIVATE_KEY)"
            echo "::error::with 'Dependabot alerts: read' + 'Issues: write' — required upstream"
            echo "::error::where fine-grained PATs are org-blocked. On a personal fork you may"
            echo "::error::instead set DEPENDABOT_REMEDIATION_TOKEN to a fine-grained PAT."
            echo "::error::The built-in GITHUB_TOKEN is rejected by the Dependabot alerts API"
            echo "::error::(403 'Resource not accessible by integration'), and the alerts"
            echo "::error::feature must be enabled in the repository's security settings."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::List open Dependabot alerts"
          gh api "repos/$REPO/dependabot/alerts" --paginate --jq '
            .[] | select(.state == "open") | {
              number,
              cve: .security_advisory.cve_id,
              ghsa: .security_advisory.ghsa_id,
              severity: .security_advisory.severity,
              package: .security_vulnerability.package.name,
              ecosystem: .security_vulnerability.package.ecosystem,
              fixed: .security_vulnerability.first_patched_version.identifier,
              manifest: .dependency.manifest_path
            }' | jq -s '.' > alerts.json
          echo "open alerts: $(jq length alerts.json)"
          echo "::endgroup::"

          echo "::group::Group by package"
          # One group per package; carries alert numbers, highest severity, CVEs,
          # whether a patched version exists (no-fix advisories are flagged).
          jq '
            group_by(.package)
            | map({
                package: .[0].package,
                ecosystem: .[0].ecosystem,
                alerts: [.[].number],
                cves: ([.[].cve] | map(select(. != null)) | unique),
                fixed: ([.[].fixed] | map(select(. != null)) | unique),
                has_fix: (any(.[].fixed; . != null)),
                severity: ([.[].severity] | max_by(
                    (if . == "critical" then 4 elif . == "high" then 3
                     elif . == "medium" then 2 else 1 end)))
              })
            | sort_by(if .severity == "critical" then 4 elif .severity == "high" then 3
                      elif .severity == "medium" then 2 else 1 end)
            | reverse
          ' alerts.json > groups.json
          jq -r '.[] | "  \(.severity)\t\(.package)\t\(.alerts | length) alert(s)\thas_fix=\(.has_fix)"' groups.json
          echo "::endgroup::"

          if [ -n "$FILTER" ]; then
            jq --arg f "$FILTER" '[.[] | select(
              (.package | test($f; "i")) or (.ecosystem == $f) or
              (.severity == $f) or (.cves[]? | test($f; "i")))]' groups.json > groups.filtered.json
            mv groups.filtered.json groups.json
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — no issues created. Proposed groups:"
            jq -r '.[] | "- \(.package) (\(.severity)): \(.alerts | length) alert(s), fix=\(.has_fix)"' groups.json
            exit 0
          fi

          echo "::group::Ensure labels exist"
          gh label create dependabot-remediation --repo "$REPO" --color 0e8a16 \
            --description "Automated Dependabot remediation" --force >/dev/null 2>&1 || true
          gh label create security --repo "$REPO" --color d93f0b \
            --description "Security" --force >/dev/null 2>&1 || true
          echo "::endgroup::"

          echo "::group::Open / update tracking issues"
          # Copilot coding-agent bot node id — assigning it kicks off the agent.
          # Reliable via GraphQL (gh issue create --assignee does not resolve it).
          copilot_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:50){nodes{login __typename ... on Bot{id}}}}}' \
            -f o="${REPO%/*}" -f n="${REPO#*/}" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id' 2>/dev/null || true)

          jq -c '.[]' groups.json | while read -r g; do
            pkg=$(echo "$g"        | jq -r '.package')
            sev=$(echo "$g"        | jq -r '.severity')
            has_fix=$(echo "$g"    | jq -r '.has_fix')
            alerts=$(echo "$g"     | jq -r '.alerts | map("#\(.)") | join(", ")')
            cves=$(echo "$g"       | jq -r '.cves | join(", ")')
            fixed=$(echo "$g"      | jq -r '.fixed | join(", ")')
            title="deps: remediate ${pkg} (${sev}, $(echo "$g" | jq -r '.alerts | length') alerts)"

            # Skip if an open tracking issue or remediation PR already exists.
            existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
            if [ -n "$existing" ]; then echo "exists: #$existing ($pkg)"; continue; fi

            body=$(cat <<EOF
          ## Automated Dependabot remediation — \`${pkg}\`

          @copilot please remediate this group following
          \`.github/instructions/dependabot-remediation.instructions.md\`.

          - **Package:** \`${pkg}\` (${sev})
          - **Fixed version(s):** ${fixed:-none available}
          - **CVEs:** ${cves:-n/a}
          - **Dependabot alerts:** ${alerts}
          - **Has patched version:** ${has_fix}

          Steps: bump across ALL affected modules, run \`make all-tidy\` + \`make test-compile\` + \`make lint\`, open ONE grouped PR, link a Vulnerability JIRA, and \`Closes\` any superseded native-Dependabot PRs.

          $( [ "$has_fix" = "false" ] && echo "> No patched version exists — dismiss the alert(s) with justification and track in JIRA instead of faking a fix." )
          EOF
          )
            # gh issue create prints the issue URL (it has no --json flag).
            url=$(gh issue create --repo "$REPO" --title "$title" --body "$body" \
                  --label dependabot-remediation --label security)
            num=$(basename "$url")
            echo "created #$num for $pkg"

            if [ -n "$copilot_id" ]; then
              issue_id=$(gh api "repos/$REPO/issues/$num" --jq '.node_id')
              if gh api graphql -f query='mutation($a:ID!,$actor:ID!){replaceActorsForAssignable(input:{assignableId:$a,actorIds:[$actor]}){assignable{... on Issue{number}}}}' \
                   -f a="$issue_id" -f actor="$copilot_id" >/dev/null 2>&1; then
                echo "assigned copilot-swe-agent to #$num"
              else
                echo "could not assign copilot to #$num (left unassigned)"
              fi
            else
              echo "copilot agent not assignable on $REPO; #$num left unassigned"
            fi
          done
          echo "::endgroup::"
